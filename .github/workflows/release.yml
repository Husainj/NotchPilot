name: Release

# Run from the Actions tab: enter a version, e.g. 1.2.0.
# Needs release-notes/<version>.md committed, and the SPARKLE_PRIVATE_KEY
# repository secret (see README → Releasing).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Test
        run: make test
      - name: Build, publish and update the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: make release VERSION=${{ inputs.version }}
