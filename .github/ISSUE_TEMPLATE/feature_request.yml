name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not just the solution. "When I'm on a call I can't tell if…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
